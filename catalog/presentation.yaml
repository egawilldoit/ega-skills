# EGA Skills pocket catalog — PRESENTATION METADATA ONLY.
#
# This file is NOT a skill registry and NOT a routing authority. It contains
# no routing metadata of any kind (no triggers, domains, platforms,
# anti-triggers). It only decides how the generated human catalog is grouped
# and labelled.
#
# The generated catalog is a PROJECTION of the Hub release:
#
#     HubRelease + L0 metadata + THIS FILE  ->  docs/generated/SKILL-CATALOG.md
#
# RESET STATE (hub catalog and release artifact reset):
# The release candidate pins ZERO active skills. There is therefore nothing
# to favourite and nothing to place into a human-intent group. Both sequences
# are intentionally empty; adding an id here would be a hard build error
# because the release does not contain it.
#
# Regenerate with: pnpm generate:catalog
# Validate with:   pnpm catalog:check
# NOTE: the CLI's presentation validator currently rejects an empty `groups`
# sequence. Runtime support for that case is owned by the zero-skill runtime
# change (Agent 3, cleanup/empty-catalog-runtime). Until it lands,
# `generate:catalog` and `catalog:check` fail by design; see
# packages/mcp/artifact/reset-inputs/REGENERATE.md.

catalog_version: 1

favorites: []

groups: []
