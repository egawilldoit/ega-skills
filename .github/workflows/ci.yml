name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Registry cold-import performance
        run: pnpm test:perf:registry

      - name: Token estimator vectors
        run: node --test tests/tokens/canonicalization.test.mjs tests/tokens/errors.test.mjs tests/tokens/offline.test.mjs tests/tokens/token-estimator.test.mjs

      - name: Test
        run: pnpm test:ci

      - name: Check frozen specs
        run: pnpm specs:check

  rls:
    name: contract-f rls (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Contract F RLS suite
        run: node --test tests/rls/contract-f.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
