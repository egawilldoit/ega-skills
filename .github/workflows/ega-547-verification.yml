name: EGA-547 temporary verification

on:
  push:
    branches:
      - abmortaki/ega-547-w0-initialize-pnpm-workspace-and-typescript-strict-baseline

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm 10.0.0
        run: npm install --global pnpm@10.0.0

      - name: Runtime versions
        run: |
          node --version
          pnpm --version

      - name: Clean install
        run: pnpm install --lockfile=false

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Spec drift guardrail
        run: pnpm specs:check

      - name: Diff check
        run: git diff --check
