name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Token estimator vectors
        run: node --test tests/tokens/canonicalization.test.mjs tests/tokens/errors.test.mjs tests/tokens/offline.test.mjs tests/tokens/token-estimator.test.mjs

      - name: Test
        run: pnpm test

      - name: Check frozen specs
        run: pnpm specs:check

      - name: Contract A gates
        run: |
          pnpm contracts:check-a
          pnpm contracts:test-a

      - name: Contract B gates
        run: |
          pnpm contracts:check-b
          pnpm contracts:test-b

      - name: Contract C gates
        run: |
          pnpm contracts:check-c
          pnpm contracts:test-c

      - name: Contract D gates
        run: |
          pnpm contracts:check-d
          pnpm contracts:test-d

      - name: Contract E gates
        run: |
          pnpm contracts:check-e
          pnpm contracts:test-e

      - name: Check patch formatting
        run: git diff --check
