name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build
        run: pnpm build

      - name: Validate committed deployment artifact
        run: node scripts/hosted/validate-artifact.mjs packages/mcp/artifact

      # The web deployment stages the committed artifact into apps/web/artifact
      # via `scripts/web/stage-artifact.mjs`. Verifying it here proves the thing
      # the console will actually serve is servable, without producing the
      # staged copy in CI. `--check-only` writes no files.
      - name: Verify the web deployment artifact stages and verifies
        run: node scripts/web/stage-artifact.mjs --check-only
      - name: Check generated catalog is not stale
        run: pnpm catalog:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Registry cold-import performance
        run: pnpm test:perf:registry

      - name: Token estimator vectors
        run: node --test tests/tokens/canonicalization.test.mjs tests/tokens/errors.test.mjs tests/tokens/offline.test.mjs tests/tokens/token-estimator.test.mjs

      - name: Test
        run: pnpm test:ci

      - name: Check frozen specs
        run: pnpm specs:check

  web:
    name: web console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      # The root `tsconfig.json` references the domain packages only, so
      # `pnpm build` and `pnpm typecheck` never touch apps/web. Without this step
      # the console is never compiled by CI at all, and a type error in the SPA
      # or the BFF would merge green.
      - name: Build domain packages
        run: pnpm build

      - name: Typecheck web frontend
        run: pnpm --filter @ega-skills/web typecheck

      # `server.mts` and the server modules are outside the frontend tsconfig,
      # so they are typechecked separately. A BFF-only type error is invisible to
      # the check above.
      - name: Typecheck web server
        run: pnpm --filter @ega-skills/web typecheck:server

      # The real SPA build. This is what proves the bundle compiles and that no
      # server-only package leaks into it.
      - name: Build web frontend
        run: pnpm --filter @ega-skills/web build

      # Deliberately NOT the isolation suite: that one needs a real PostgreSQL,
      # which needs a service container, and GitHub Actions rejects service
      # containers on Windows runners
      # ("Container operations are only supported on Linux runners"). It runs in
      # the `web-isolation` job below instead, so the Windows leg of this matrix
      # stays runnable.
      # Executed React component behaviour. Separate from `node --test` because
      # .tsx is not something Node's type stripping transforms, and kept separate
      # so the `pnpm test:ci` count is unchanged and this gate is reported on its
      # own rather than folded into a total that also means something else.
      - name: Web component behaviour (executed React)
        run: pnpm test:web:components

      - name: Web API and integration tests
        run: node --test tests/web/api-routes.test.mjs tests/web/api-client.test.mjs tests/web/catalog.test.mjs tests/web/skills.test.mjs tests/web/releases.test.mjs tests/web/release-identity.test.mjs tests/web/console-server.test.mjs tests/web/console-model.test.mjs tests/web/console-permissions.test.mjs tests/web/stage-artifact.test.mjs tests/web/analytics-window.test.mjs

      - name: Check out pinned source catalog fixture
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: egawilldoit/skills
          ref: 8f264fc5fcb5691694c3653287f4d9370c5b025c
          path: .source-skill-fixture
          persist-credentials: false

      - name: Source proposal tests
        shell: bash
        env:
          EGA_SOURCE_FIXTURE: ${{ github.workspace }}/.source-skill-fixture
        run: |
          set -euo pipefail
          for path in scripts/sync_openai_yaml.py scripts/build_upstream_sources.py; do
            actual=$(git -C "$EGA_SOURCE_FIXTURE" hash-object --no-filters "$path")
            expected=$(git -C "$EGA_SOURCE_FIXTURE" rev-parse "HEAD:$path")
            if [[ "$actual" != "$expected" ]]; then
              printf 'Fixture bytes differ from the pinned blob: %s\n' "$path" >&2
              exit 1
            fi
          done
          node --test tests/web/source-manager/*.test.mjs

      - name: Validate proposed source fixture trees
        if: runner.os == 'Linux'
        shell: bash
        env:
          EGA_SOURCE_FIXTURE: ${{ github.workspace }}/.source-skill-fixture
          EGA_PLAN_OUTPUT: ${{ runner.temp }}/source-add.json
          EGA_UPDATE_PLAN_OUTPUT: ${{ runner.temp }}/source-update.json
          EGA_REMOVE_PLAN_OUTPUT: ${{ runner.temp }}/source-remove.json
        run: |
          set -euo pipefail
          node --test tests/web/source-manager/planner.test.mjs
          python3 -m pip install --disable-pip-version-check -r "$EGA_SOURCE_FIXTURE/requirements-ci.txt"
          failed=0
          run_check() {
            if "$@"; then
              printf 'PASS: %s\n' "$*"
            else
              result=$?
              printf 'FAIL (%s): %s\n' "$result" "$*"
              failed=1
            fi
          }
          for operation in add update remove; do
            candidate="$RUNNER_TEMP/source-candidate-$operation"
            cp -a "$EGA_SOURCE_FIXTURE" "$candidate"
            python3 tests/web/source-manager/apply-fixture-plan.py "$candidate" "$RUNNER_TEMP/source-$operation.json"
            printf '\nValidating %s proposal\n' "$operation"
            pushd "$candidate" > /dev/null
            run_check python3 scripts/validate_plugin_manifest.py
            run_check python3 scripts/validate_catalog.py
            run_check python3 scripts/sync_openai_yaml.py --check
            run_check python3 scripts/sync_operating_contract.py --check
            run_check python3 scripts/routing_audit.py
            run_check python3 scripts/trigger_audit.py
            run_check python3 scripts/validate_ega_metadata.py
            run_check python3 -m unittest discover -s tests -p 'test_*.py' -v
            run_check git diff --check
            popd > /dev/null
          done
          exit "$failed"

  web-isolation:
    name: web isolation (real PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Linux only, and not because of a preference: Actions supports service
    # containers on Linux runners exclusively. The cross-workspace isolation
    # proof is worthless without a real database — the suite throws rather than
    # skipping when `EGA_RLS_DATABASE_URL` is unset — so it gets its own
    # Linux-only job rather than being dropped to make Windows pass.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build domain packages
        run: pnpm build

      - name: Cross-workspace isolation (real PostgreSQL 16)
        run: node --test tests/web/cross-workspace-isolation.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Telemetry authorization, delegated containment, retention and the
      # permitted-field constraints. Real PostgreSQL: the properties are
      # properties of RLS resolution and function privilege, not of TypeScript.
      - name: Telemetry authorization and retention (real PostgreSQL 16)
        run: node --test tests/rls/telemetry-authz.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres


      # Install pg_cron only after the ordinary disposable-database suites.
      # The scheduler test uses the cluster's isolated metadata database.
      - name: Enable pg_cron in disposable PostgreSQL
        run: |
          docker exec --user root ${{ job.services.postgres.id }} bash -c 'apt-get update -qq && apt-get install -y postgresql-16-cron'
          docker exec --user postgres ${{ job.services.postgres.id }} bash -c "echo shared_preload_libraries=pg_cron >> /var/lib/postgresql/data/postgresql.conf; echo cron.use_background_workers=on >> /var/lib/postgresql/data/postgresql.conf"
          docker restart ${{ job.services.postgres.id }}
          for attempt in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; then break; fi
            sleep 1
          done

      - name: Retention scheduler execution (real pg_cron)
        run: node --test tests/rls/telemetry-scheduler.rls.mjs
        env:
          EGA_PGCRON_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Dedicated writer through isolated REST gateway
        run: node scripts/testing/telemetry-gateway.mjs
        env:
          EGA_PGCRON_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  rls:
    name: contract-f rls (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Contract F RLS suite
        run: node --test tests/rls/contract-f.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The catalog bootstrap's SQL is generated, so it is exercised against the
      # real schema: idempotency, conflict refusal and the dependency-aware
      # rollback are database behaviour and cannot be proved by reading a string.
      - name: Catalog bootstrap (real PostgreSQL 16)
        run: node --test tests/rls/catalog-bootstrap.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: EGA-718 live membership regression (unscoped hosted search)
        run: node --test tests/rls/hosted-live-membership.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: EGA-755 live membership regression (skill-scoped hosted inspect/get_content)
        run: node --test tests/rls/hosted-skill-scoped-live-membership.rls.mjs
        env:
          EGA_RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
